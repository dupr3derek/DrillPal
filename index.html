<style>

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
.wrap{max-width:560px;margin:0 auto}

.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}.logo .sp{flex:1}.lang{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 8px}.lang option{color:#14212B}

.row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.sub{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pips{display:inline-flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.pips i.on{background:var(--ball);border-color:#8A9100}
.bio{margin:12px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

.btn.sm{padding:7px 12px}
.acts{display:flex;gap:8px}
h2{font-size:20px;margin:6px 0 12px}
.empty{color:var(--muted);padding:24px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

.foot{color:var(--muted);font-size:13px;margin-top:20px}

    }).catch(function(){}).then(function(){return claude.use("db")}).then(function(db){
      if(!db)return;
      DB={save:function(d){return db.doc("players/"+ME).set(d).then(function(){return ME})}};
      db.collection("players").onSnapshot(function(snap){
        setRows(snap.docs.filter(function(d){return d.exists}).map(function(d){var x=d.data();x.id=d.id;return x}));
      },function(){});
    }).catch(function(){}).then(function(){renderProfile()});
  }else{
    REMOTE=true;
    try{ME=localStorage.getItem("drillpal-me")||"pending";KEY=localStorage.getItem("drillpal-key")}catch(e){ME="pending"}
    DB={save:remoteSave};
    remoteLoad();
  }
}

/* ---------- discover ---------- */
function av(p){return '<span class="av" style="--h:'+p.h+'">'+esc(p.n.split(" ").slice(0,2).map(function(w){return w[0]||""}).join(""))+'</span>'}
function pips(p){return '<span class="pips" role="img" aria-label="'+esc(T(p.lv))+'">'+[1,2,3].map(function(i){return '<i class="'+(i<=LEVELS.indexOf(p.lv)+1?"on":"")+'"></i>'}).join("")+'</span>'}
function card(p,extra){
  var tags=[T(p.time),T(p.st)].concat(dsort(p.drills).map(function(k){return T(k)}));
  return '<article class="card"><div class="top">'+av(p)+'<div><b>'+esc(p.n)+'</b><div class="sub">'+pips(p)+'<span>'+esc(T(p.lv))+'</span><span>'+loc(p)+'</span></div></div></div>'
    +(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':'')
    +'<div class="tags">'+tags.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join("")+'</div>'+(extra||"")+'</article>';
}
function renderList(){
  var f=M.filter(function(p){
    return (S.level==="All"||p.lv===S.level)&&(!S.drill||p.drills.indexOf(S.drill)>-1)
      &&(S.time==="Any time"||p.time===S.time)&&(!S.where||p.area.toLowerCase().indexOf(S.where)>-1);
  });
  $("#list").innerHTML=f.length?f.map(function(p){return card(p)}).join("")
    :'<p class="empty">'+esc(T(M.length?"No players match. Try different filters.":"No players yet. Be the first to register in the Profile tab."))+'</p>';
}
function buildFilters(){
  $("#lvl").innerHTML=["All"].concat(LEVELS).map(function(l){return '<button class="chip" data-act="lvl" data-v="'+l+'" aria-pressed="'+(S.level===l)+'">'+esc(T(l))+'</button>'}).join("");
  $("#drill").innerHTML='<option value="">'+esc(T("Any drill"))+'</option>'+opts(dsort(DR),S.drill);
  $("#time").innerHTML=opts(["Any time"].concat(TIMES),S.time);
  S.wsig="";buildWhere();
}
function buildWhere(){
  var seen={},o=[];
  M.forEach(function(p){var a=p.area.trim(),k=a.toLowerCase();if(a&&!seen[k]){seen[k]=1;o.push(a)}});
  o.sort(function(a,b){return a.localeCompare(b)});
  var sig=o.join("|");if(sig===S.wsig)return;S.wsig=sig;
  $("#wherelist").innerHTML=o.map(function(a){return '<option value="'+esc(a)+'">'}).join("");
}

/* ---------- profile ---------- */
function canMod(m){return REMOTE?!!(KEY&&m.id===ME):true}
function renderProfile(){
  var el=$("#profile"),m=mine();
  if(!DB||!ME||!CAN){el.innerHTML='<h2>'+esc(T("Profile"))+'</h2><p class="empty">'+esc(T("Registration needs a signed-in account with edit access."))+'</p>';return}
  if(m&&!S.editing){
    el.innerHTML='<h2>'+esc(T("Profile"))+'</h2>'+card(m,'<div class="acts">'
      +(canMod(m)?'<button class="btn" data-act="edit">'+esc(T("Modify"))+'</button>':'')
      +(REMOTE?'<button class="btn ghost" data-act="new">'+esc(T("Add new profile"))+'</button>':'')+'</div>');
    return;
  }
  var v=(m&&!S.fresh)?m:{n:"",lv:LEVELS[0],time:TIMES[0],st:STYLES[0],area:"",country:"",bio:"",drills:[]};
  var drills=dsort(DR).map(function(x){return '<label><input type="checkbox" value="'+esc(x)+'"'+(v.drills.indexOf(x)>-1?" checked":"")+'> '+esc(T(x))+'</label>'}).join("");
  var countries=cList().map(function(x){return '<option value="'+esc(x.n)+'">'}).join("");
  el.innerHTML='<h2>'+esc(T(m&&!S.fresh?"Modify profile":"Create your profile"))+'</h2><div class="form">'
    +'<label>'+esc(T("Your name"))+'<input id="f-n" maxlength="40" autocomplete="name" value="'+esc(v.n)+'"></label>'
    +'<label>'+esc(T("Skill level"))+'<select id="f-lv">'+opts(LEVELS,v.lv)+'</select></label>'
    +'<label>'+esc(T("When"))+'<select id="f-t">'+opts(TIMES,v.time)+'</select></label>'
    +'<label>'+esc(T("Play style"))+'<select id="f-s">'+opts(STYLES,v.st)+'</select></label>'
    +'<fieldset class="fs"><legend>'+esc(T("Drills you want to practice"))+'</legend><div class="chk">'+drills+'</div></fieldset>'
    +'<label>'+esc(T("Country"))+'<input id="f-c" list="countries" autocomplete="off" placeholder="'+esc(T("Start typing to search"))+'" value="'+esc(v.country?cname(v.country):"")+'"></label><datalist id="countries">'+countries+'</datalist>'
    +'<label>'+esc(T("Suburb or District"))+'<input id="f-a" list="suburbs" autocomplete="off" maxlength="60" placeholder="'+esc(T("Start typing to search"))+'" value="'+esc(v.area)+'"></label><datalist id="suburbs"></datalist>'
    +'<label>'+esc(T("Short bio (optional)"))+'<textarea id="f-b" rows="3" maxlength="140">'+esc(v.bio)+'</textarea></label>'
    +'<div class="acts"><button class="btn" data-act="save">'+esc(T("Save profile"))+'</button>'+(m?'<button class="btn ghost" data-act="cancel">'+esc(T("Cancel"))+'</button>':'')+'</div>'
    +'<p class="msg-note" id="f-m" role="status"></p></div>';
}
function saveProfile(){
  var msg=$("#f-m"),n=$("#f-n").value.trim();
  if(!n){msg.textContent=T("Enter your name.");$("#f-n").focus();return}
  var cv=$("#f-c").value.trim().toLowerCase();
  var cc=cList().filter(function(x){return x.n.toLowerCase()===cv||x.c.toLowerCase()===cv})[0];
  if(!cc){msg.textContent=T("Choose a country from the list.");$("#f-c").focus();return}
  var picked=Array.prototype.map.call(document.querySelectorAll("#profile .chk input:checked"),function(c){return c.value});
  var d={name:n.slice(0,40),lv:$("#f-lv").value,time:$("#f-t").value,st:$("#f-s").value,area:$("#f-a").value.trim().slice(0,60),
    country:cc.c,drills:picked.join(","),bio:$("#f-b").value.trim().slice(0,140),ts:Date.now()};
  DB.save(d).then(function(id){
    d.id=id;M=M.filter(function(x){return x.id!==id}).concat(mem(d));
    S.editing=false;S.fresh=false;toast(T("Profile saved"));
    renderProfile();buildWhere();renderList();
  }).catch(function(){msg.textContent=T("Could not save. Try again.")});
}
function suggest(){
  var a=$("#f-a"),dl=$("#suburbs"),c=$("#f-c");if(!a||!dl||!c)return;
  var cv=c.value.trim().toLowerCase(),hit=cList().filter(function(x){return x.n.toLowerCase()===cv})[0],q=a.value.trim();
  clearTimeout(sugTimer);if(sugCtl)sugCtl.abort();
  if(!hit||q.length<2){dl.innerHTML="";return}
  sugTimer=setTimeout(function(){
    var l={"zh-CN":"zh","zh-TW":"zh",ja:"ja",vi:"vi"}[lang]||"en";
    sugCtl=typeof AbortController!=="undefined"?new AbortController():null;
    fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=20&language="+l+"&countryCode="+hit.c,sugCtl?{signal:sugCtl.signal}:{})
      .then(function(r){return r.json()}).then(function(j){
        var seen={},out=[];
        (j.results||[]).forEach(function(x){
          if(x.country_code&&x.country_code!==hit.c)return;
          var v=x.name+(x.admin1&&x.admin1!==x.name?", "+x.admin1:"");
          if(!seen[v]){seen[v]=1;out.push(v)}
        });
        dl.innerHTML=out.slice(0,10).map(function(v){return '<option value="'+esc(v)+'">'}).join("");
      }).catch(function(){});
  },250);
}

/* ---------- ui ---------- */
function show(t){
  S.tab=t;
  ["discover","profile"].forEach(function(k){$("#"+k).hidden=k!==t});
  document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===t)});
  if(t==="profile")renderProfile();
  window.scrollTo(0,0);
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=T(el.dataset.i18n)});
  $("#lvl").setAttribute("aria-label",T("Skill level"));
  $("#lang").setAttribute("aria-label",T("Language"));$("#lang").value=lang;
  $("#where").placeholder=T("Any suburb");
  buildFilters();renderList();renderProfile();
}
function pickLang(){
  var l="";try{l=localStorage.getItem("dp-lang")||""}catch(e){}
  if(LANGS.indexOf(l)>-1)return l;
  var n=navigator.language||"en";
  if(/^zh/i.test(n))return /TW|HK|MO|Hant/i.test(n)?"zh-TW":"zh-CN";
  n=n.slice(0,2).toLowerCase();
  return LANGS.indexOf(n)>-1?n:"en";
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){show(t.dataset.tab);return}
  var a=t.dataset.act;
  if(a==="lvl"){S.level=t.dataset.v;buildFilters();renderList()}
  else if(a==="edit"){S.editing=true;renderProfile()}
  else if(a==="new"){S.fresh=true;S.editing=true;renderProfile()}
  else if(a==="cancel"){S.editing=false;S.fresh=false;renderProfile()}
  else if(a==="save"){saveProfile()}
});
document.addEventListener("input",function(e){
  var id=e.target.id;
  if(id==="where"){S.where=e.target.value.trim().toLowerCase();renderList()}
  else if(id==="f-a"||id==="f-c")suggest();
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="drill"){S.drill=e.target.value;renderList()}
  else if(id==="time"){S.time=e.target.value;renderList()}
  else if(id==="lang"){lang=e.target.value;try{localStorage.setItem("dp-lang",lang)}catch(x){}applyLang()}
  else if(id==="f-c"){var a=$("#f-a"),d=$("#suburbs");if(a)a.value="";if(d)d.innerHTML=""}
});
lang=pickLang();
applyLang();
init();
</script>
</body>
</html>
