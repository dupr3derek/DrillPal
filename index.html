<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DrillPal: find pickleball partners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EAF0F3;--surface:#fff;--ink:#14212B;--muted:#566774;--court:#1F5C8B;--court-ink:#fff;--hero:#1F5C8B;--ball:#D8E234;--line:#CFDAE1;--ok:#1E7A4F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A22;--surface:#16262F;--ink:#E8F0F4;--muted:#9AAAB5;--court:#7DBCE8;--court-ink:#0E1A22;--hero:#173F5E;--line:#2A3C47;--ok:#5CD08F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A22;--surface:#16262F;--ink:#E8F0F4;--muted:#9AAAB5;--court:#7DBCE8;--court-ink:#0E1A22;--hero:#173F5E;--line:#2A3C47;--ok:#5CD08F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
.wrap{max-width:560px;margin:0 auto}
header{background:var(--hero);color:#fff;padding:28px 20px 26px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:rgba(255,255,255,.55)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}.logo .sp{flex:1}.lang{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 8px}.lang option{color:#14212B}
.ball{width:18px;height:18px;border-radius:50%;background:var(--ball);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
h1{font-size:34px;line-height:1.05;font-weight:800;margin:18px 0 8px;letter-spacing:-.02em;max-width:12ch}
header p{margin:0;opacity:.9;max-width:34ch}
main{padding:16px 16px 110px}
section[hidden]{display:none}
.filters{display:grid;gap:12px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.sel{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--court-ink);font-weight:600}
.row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row2 label{font-size:14px;color:var(--muted)}
input[type=range]{accent-color:var(--court);flex:1;min-width:120px}
.card,.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:hsl(var(--h) 45% 38%)}
.top b{display:block;font-size:17px}
.sub{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pips{display:inline-flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.pips i.on{background:var(--ball);border-color:#8A9100}
.bio{margin:12px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.btn{font:inherit;font-weight:600;background:var(--court);color:var(--court-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.7;cursor:default}
.btn.sm{padding:7px 12px}
.acts{display:flex;gap:8px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15px;color:var(--muted);margin:20px 0 10px;font-weight:600}
.empty{color:var(--muted);padding:24px 4px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between}
.item .who{display:flex;gap:12px;align-items:center;min-width:0}
.item small{display:block;color:var(--muted)}
.state-ok{color:var(--ok);font-weight:600;font-size:14px}
ul{list-style:none;margin:0;padding:0}
.rowbtn{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rowbtn small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.thread-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{font:inherit;background:none;border:0;color:var(--court);cursor:pointer;padding:6px 8px 6px 0;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:240px;padding:4px 0 12px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.m.me{align-self:flex-end;background:var(--court);color:var(--court-ink);border-color:var(--court)}
.composer{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer input{flex:1;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;font:inherit;background:none;border:0;color:var(--muted);padding:12px 4px;cursor:pointer;position:relative;font-weight:600}
.tab[aria-selected="true"]{color:var(--court);box-shadow:inset 0 3px 0 var(--court)}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--ball);color:#222;font-size:12px;line-height:18px;text-align:center;margin-left:6px}
.foot{color:var(--muted);font-size:13px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.form{display:grid;gap:14px}.form label{font-size:14px;color:var(--muted);display:grid;gap:6px}.form input,.form select,.form textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}.msg-note{color:var(--muted);font-size:14px;margin:0}nav .tab{font-size:14px}#where{flex:1;min-width:140px}
:focus-visible{outline:3px solid var(--court);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

<div class="wrap">
<header>
  <div class="logo"><span class="ball"></span>DrillPal<span class="sp"></span><select id="lang" class="lang" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="vi">Tiếng Việt</option></select></div>
  <h1 data-i18n="Find someone to DRILL with.">Find someone to DRILL with.</h1>
  <p data-i18n="Match with nearby players by skill level, schedule, and play style.">Match with nearby players by skill level, schedule, and play style.</p>
</header>
<main>
  <section id="discover">
    <div class="filters">
      <div class="chips" id="lvl" role="group" aria-label="Skill level"></div>
      <div class="row2">
        <label for="time" data-i18n="When">When</label>
        <select id="time" class="sel">
          
        </select>
      </div>
      <div class="row2">
        <label for="where" data-i18n="Where">Where</label>
        <input id="where" class="sel" list="wherelist" autocomplete="off">
        <datalist id="wherelist"></datalist>
      </div>
    </div>
    <div id="list"></div>
    <p class="foot" data-i18n="Other players see your name, suburb or district, and country, never your address."></p>
  </section>
  <section id="requests" hidden></section>
  <section id="chat" hidden></section>
  <section id="profile" hidden></section>
</main>
</div>
<nav><div class="in" role="tablist">
  <button class="tab" role="tab" data-tab="discover" aria-selected="true"><span data-i18n="Discover">Discover</span></button>
  <button class="tab" role="tab" hidden data-tab="requests" aria-selected="false"><span data-i18n="Requests">Requests</span><span class="badge" id="bd"></span></button>
  <button class="tab" role="tab" hidden data-tab="chat" aria-selected="false"><span data-i18n="Chat">Chat</span></button>
  <button class="tab" role="tab" data-tab="profile" aria-selected="false"><span data-i18n="Profile">Profile</span></button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

try{lang=localStorage.getItem("dp-lang")||""}catch(e){lang=""}
if(lang!=="en"&&!LI.hasOwnProperty(lang)){var nl=navigator.language||"en";nl=/^zh/i.test(nl)?(/TW|HK|MO|Hant/i.test(nl)?"zh-TW":"zh-CN"):nl.slice(0,2).toLowerCase();lang=LI.hasOwnProperty(nl)?nl:"en"}
function T(k,n){var v=lang==="en"?k:((D[k]||[])[LI[lang]]||k);return n?v.replace("{n}",n):v}
var S={tab:"discover",level:"All",time:"Any time",dist:15,sent:{},chats:{},open:null};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var byId=function(id){return P.filter(function(p){return p.id===+id})[0]};
var first=function(p){return p.n.split(" ")[0]};
function av(p){return '<span class="av" style="--h:'+p.h+'">'+esc(p.n.split(" ").slice(0,2).map(function(w){return w[0]||""}).join(""))+'</span>'}
function pips(p){return '<span class="pips" role="img" aria-label="'+T(p.lv)+'">'+[1,2,3].map(function(i){return '<i class="'+(i<=L[p.lv]?"on":"")+'"></i>'}).join("")+'</span>'}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("on")},2600)}

function renderChips(){
  $("#lvl").innerHTML=["All","Beginner","Intermediate","Advanced"].map(function(l){return '<button class="chip" data-act="lvl" data-v="'+l+'" aria-pressed="'+(S.level===l)+'">'+T(l)+'</button>'}).join("");
}
function buildWhere(){
  var seen={},o=[];
  M.forEach(function(p){var a=(p.area||"").trim(),k=a.toLowerCase();if(a&&!seen[k]){seen[k]=1;o.push(a)}});
  o.sort(function(a,b){return a.localeCompare(b)});
  var sig=o.join("|");if(sig===S.wsig)return;S.wsig=sig;
  $("#wherelist").innerHTML=o.map(function(a){return '<option value="'+esc(a)+'">'}).join("");
}
function renderList(){buildWhere();
  var f=M.concat(P).filter(function(p){return (S.level==="All"||p.lv===S.level)&&(S.time==="Any time"||p.time===S.time)&&(p.member||p.km<=S.dist)&&(!S.where||(p.area||"").toLowerCase().indexOf(S.where)>-1)});
  $("#list").innerHTML=f.length?f.map(function(p){
    var s=S.sent[p.id],b;if(p.member){b='<span class="tag">'+T("Member")+'</span>'}else 
    if(!s)b='<button class="btn" data-act="req" data-id="'+p.id+'">'+T("Send request")+'</button>';
    else if(s==="pending")b='<button class="btn ghost" disabled>'+T("Request sent")+'</button>';
    else b='<button class="btn ghost" data-act="chat" data-id="'+p.id+'">'+T("Open chat")+'</button>';
    return '<article class="card"><div class="top">'+av(p)+'<div><b>'+esc(p.n)+'</b><div class="sub">'+pips(p)+'<span>'+T(p.lv)+'</span><span>'+(p.member?loc(p):p.km+' '+T("km away"))+'</span></div></div></div><p class="bio">'+esc(p.bio)+'</p><div class="tags"><span class="tag">'+T(p.time)+'</span><span class="tag">'+T(p.st)+'</span></div>'+b+'</article>';
  }).join(""):'<p class="empty">'+T(M.length?"No players match. Try a different level or time.":"No players yet. Be the first to register in the Profile tab.")+'</p>';
}
function renderReq(){
  var inc=INC.map(function(id){var p=byId(id);return '<div class="item"><div class="who">'+av(p)+'<div><b>'+p.n+'</b><small>'+T(p.lv)+', '+T(p.time)+'</small></div></div><div class="acts"><button class="btn sm" data-act="acc" data-id="'+id+'">'+T("Accept")+'</button><button class="btn sm ghost" data-act="dec" data-id="'+id+'">'+T("Decline")+'</button></div></div>'}).join("");
  var ids=Object.keys(S.sent);
  var out=ids.map(function(id){var p=byId(id),a=S.sent[id]==="accepted";return '<div class="item"><div class="who">'+av(p)+'<div><b>'+p.n+'</b><small>'+T(p.time)+'</small></div></div>'+(a?'<span class="state-ok">'+T("Accepted")+'</span>':'<small>'+T("Waiting for reply")+'</small>')+'</div>'}).join("");
  $("#requests").innerHTML='<h2>'+T("Requests")+'</h2><h3>'+T("Wants to play with you")+'</h3>'+(inc||'<p class="empty">'+T("No new requests.")+'</p>')+'<h3>'+T("Requests you sent")+'</h3>'+(out||'<p class="empty">'+T("Send a request from Discover to get started.")+'</p>');
  $("#bd").textContent=INC.length||"";$("#bd").style.display=INC.length?"inline-block":"none";
}
function paintMsgs(){
  var m=$("#msgs");if(!m)return;
  m.innerHTML=S.chats[S.open].map(function(x){return '<div class="m'+(x.me?" me":"")+'">'+esc(x.t)+'</div>'}).join("");
  window.scrollTo(0,document.body.scrollHeight);
}
function renderChat(){
  var el=$("#chat");
  if(S.open==null){
    var ids=Object.keys(S.chats);
    el.innerHTML='<h2>'+T("Chat")+'</h2>'+(ids.length?'<ul>'+ids.map(function(id){var p=byId(id),c=S.chats[id];return '<li><button class="rowbtn" data-act="chat" data-id="'+id+'">'+av(p)+'<span><b>'+p.n+'</b><small>'+esc(c[c.length-1].t)+'</small></span></button></li>'}).join("")+'</ul>':'<p class="empty">'+T("No chats yet. Once a player accepts your request, you can plan a game here.")+'</p>');
  }else{
    var p=byId(S.open);
    el.innerHTML='<div class="thread-h"><button class="back" data-act="back">‹ '+T("Chat")+'</button>'+av(p)+'<b>'+p.n+'</b></div><div id="msgs" class="msgs" aria-live="polite"></div><div class="composer"><input id="msg" placeholder="'+T("Suggest a time and court")+'" autocomplete="off" aria-label="'+T("Message")+'"><button class="btn" data-act="send">'+T("Send")+'</button></div>';
    paintMsgs();
  }
}
function show(t){
  S.tab=t;
  ["discover","requests","chat","profile"].forEach(function(k){$("#"+k).hidden=k!==t});
  document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===t)});
  if(t==="chat"){renderChat()}
  if(t==="requests"){renderReq()}if(t==="profile"){renderProfile()}
  window.scrollTo(0,0);
}
function ensureChat(id,msgs){if(!S.chats[id])S.chats[id]=msgs}
function sendMsg(){
  var i=$("#msg"),t=i.value.trim();if(!t)return;
  var id=S.open;S.chats[id].push({me:true,t:t});i.value="";paintMsgs();i.focus();
  var R=["Sounds good. Which court?","I can do that. See you there.","Perfect. I’ll bring extra balls.","Works for me. Want to warm up first?"];
  setTimeout(function(){S.chats[id].push({me:false,t:T(R[Math.floor(Math.random()*R.length)])});if(S.tab==="chat"&&S.open===id)paintMsgs();else toast(T("New message from {n}",first(byId(id))))},1300);
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){S.open=null;show(t.dataset.tab);return}
  var a=t.dataset.act,id=t.dataset.id;
  if(a==="lvl"){S.level=t.dataset.v;renderChips();renderList()}
  else if(a==="req"){
    S.sent[id]="pending";renderList();toast(T("Request sent to {n}",first(byId(id))));
    setTimeout(function(){S.sent[id]="accepted";ensureChat(id,[{me:false,t:T("Hey! Thanks for the request. When are you free to play?")}]);renderList();if(S.tab==="requests")renderReq();toast(T("{n} accepted your request",first(byId(id))))},2200);
  }
  else if(a==="acc"){INC=INC.filter(function(x){return x!==+id});S.sent[id]="accepted";ensureChat(id,[{me:false,t:T("Great to connect. What days work for you?")}]);renderReq();renderList();toast(T("Accepted. Say hi in Chat."))}
  else if(a==="dec"){INC=INC.filter(function(x){return x!==+id});renderReq();toast(T("Request declined"))}
  else if(a==="chat"){S.open=+id;show("chat")}
  else if(a==="back"){S.open=null;renderChat()}
  else if(a==="send"){sendMsg()}else if(a==="save"){saveProfile()}else if(a==="edit"){S.editing=true;renderProfile()}else if(a==="new"){S.fresh=true;S.editing=true;renderProfile()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="msg")sendMsg()});
$("#time").addEventListener("change",function(e){S.time=e.target.value;renderList()});
$("#where").addEventListener("input",function(e){S.where=e.target.value.trim().toLowerCase();renderList()});
var M=[],ME=null,DB=null,CAN=null,NOEDIT=false;

var STY=["Social doubles","Competitive doubles","Tournament prep","Casual singles","Casual rallies","Mixed doubles"];

function cname(c){try{return new Intl.DisplayNames([lang],{type:"region"}).of(c)||c}catch(e){return c}}
function cList(){return CC.map(function(c){return {c:c,n:cname(c)}}).sort(function(a,b){return a.n.localeCompare(b.n,lang)})}
function loc(p){return [p.area,p.country?cname(p.country):""].filter(Boolean).map(esc).join(", ")}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function mem(d){return {id:d.id,n:d.name,lv:d.lv,time:d.time,st:d.st,area:d.area||"",country:d.country||"",bio:d.bio||"",h:hue(d.id),member:true}}
function opts(l,sel){return l.map(function(x){return '<option value="'+x+'"'+(x===sel?" selected":"")+'>'+T(x)+'</option>'}).join("")}
function renderProfile(){
  var el=$("#profile"),me=null;
  if(ME)me=M.filter(function(x){return x.id===ME})[0];
  if(!DB||!ME||CAN===false){el.innerHTML='<h2>'+T("Profile")+'</h2><p class="empty">'+T("Registration needs a signed-in account with edit access.")+'</p>';return}
  if(me&&!S.editing){el.innerHTML='<h2>'+T("Profile")+'</h2><article class="card"><div class="top">'+av(me)+'<div><b>'+esc(me.n)+'</b><div class="sub">'+pips(me)+'<span>'+T(me.lv)+'</span><span>'+loc(me)+'</span></div></div></div><p class="bio">'+esc(me.bio)+'</p><div class="tags"><span class="tag">'+T(me.time)+'</span><span class="tag">'+T(me.st)+'</span></div>'+(NOEDIT?'<button class="btn" data-act="new">'+T("Add new profile")+'</button>':'<button class="btn ghost" data-act="edit">'+T("Edit profile")+'</button>')+'</article>';return}
  var v=(me&&!S.fresh)?me:{n:"",lv:"Beginner",time:TIMES[0],st:STY[0],area:"",bio:""};
  el.innerHTML='<h2>'+T("Create your profile")+'</h2><div class="form"><label>'+T("Your name")+'<input id="f-n" maxlength="40" autocomplete="name" value="'+esc(v.n)+'"></label><label>'+T("Skill level")+'<select id="f-lv">'+opts(["Beginner","Intermediate","Advanced"],v.lv)+'</select></label><label>'+T("When")+'<select id="f-t">'+opts(TIMES,v.time)+'</select></label><label>'+T("Play style")+'<select id="f-s">'+opts(STY,v.st)+'</select></label><label>'+T("Country")+'<input id="f-c" list="countries" autocomplete="off" placeholder="'+T("Start typing to search")+'" value="'+esc(v.country?cname(v.country):"")+'"></label><datalist id="countries">'+cList().map(function(x){return '<option value="'+esc(x.n)+'">'}).join("")+'</datalist><label>'+T("Suburb or District")+'<input id="f-a" list="suburbs" autocomplete="off" maxlength="60" placeholder="'+T("Start typing to search")+'" value="'+esc(v.area)+'"></label><datalist id="suburbs"></datalist><label>'+T("Short bio (optional)")+'<textarea id="f-b" rows="3" maxlength="140">'+esc(v.bio)+'</textarea></label><button class="btn" data-act="save">'+T("Save profile")+'</button><p class="msg-note" id="f-m" role="status"></p></div>';
}
var SUG=null,SUGT=0;
function ccFromInput(){var el=$("#f-c");if(!el)return "";var cv=el.value.trim().toLowerCase(),c=cList().filter(function(x){return x.n.toLowerCase()===cv})[0];return c?c.c:""}
function suggest(){
  var a=$("#f-a"),dl=$("#suburbs");if(!a||!dl)return;
  var cc=ccFromInput(),q=a.value.trim();
  clearTimeout(SUGT);if(SUG&&SUG.abort)SUG.abort();
  if(!cc||q.length<2){dl.innerHTML="";return}
  SUGT=setTimeout(function(){
    var l={"zh-CN":"zh","zh-TW":"zh",ja:"ja",vi:"vi"}[lang]||"en";
    SUG=typeof AbortController!=="undefined"?new AbortController():null;
    fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=20&language="+l+"&countryCode="+cc,SUG?{signal:SUG.signal}:{}).then(function(r){return r.json()}).then(function(j){
      var seen={},out=[];
      (j.results||[]).forEach(function(x){
        if(x.country_code&&x.country_code!==cc)return;
        var v=x.name+(x.admin1&&x.admin1!==x.name?", "+x.admin1:"");
        if(!seen[v]){seen[v]=1;out.push(v)}
      });
      dl.innerHTML=out.slice(0,10).map(function(v){return '<option value="'+esc(v)+'">'}).join("");
    }).catch(function(){});
  },250);
}
document.addEventListener("input",function(e){if(e.target.id==="f-a"||e.target.id==="f-c")suggest()});
document.addEventListener("change",function(e){if(e.target.id==="f-c"){var a=$("#f-a"),d=$("#suburbs");if(a&&a.value)a.value="";if(d)d.innerHTML=""}});
function saveProfile(){
  var n=$("#f-n").value.trim(),m=$("#f-m");
  if(!n){m.textContent=T("Enter your name.");$("#f-n").focus();return}
  var cv=$("#f-c").value.trim().toLowerCase(),cc=cList().filter(function(x){return x.n.toLowerCase()===cv||x.c.toLowerCase()===cv})[0];
  if(!cc){m.textContent=T("Choose a country from the list.");$("#f-c").focus();return}
  var d={name:n.slice(0,40),lv:$("#f-lv").value,time:$("#f-t").value,st:$("#f-s").value,area:$("#f-a").value.trim().slice(0,60),country:cc.c,bio:$("#f-b").value.trim().slice(0,140),ts:Date.now()};
  DB.doc("players/"+ME).set(d).then(function(){
    var id=ME;d.id=id;M=M.filter(function(x){return x.id!==id}).concat(mem(d));
    S.editing=false;S.fresh=false;toast(T("Profile saved"));renderProfile();renderList();
  }).catch(function(){m.textContent=T("Could not save. Try again.")});
}
function localDb(){
  var K="drillpal-players",subs=[];
  function load(){try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return {}}}
  function emit(){var o=load(),snap={docs:Object.keys(o).map(function(id){return {id:id,exists:true,data:function(){return o[id]}}})};subs.forEach(function(f){f(snap)})}
  return {
    doc:function(p){var id=p.split("/")[1];return {set:function(d){return new Promise(function(res,rej){try{var o=load();o[id]=d;localStorage.setItem(K,JSON.stringify(o));emit();res()}catch(e){rej(e)}})}}},
    collection:function(){return {onSnapshot:function(f){subs.push(f);emit()}}}
  };
}
var SB="https://ufgtdbuzgfwwntkfjjqe.supabase.co/rest/v1/players",SBK="sb_publishable_BAVr38sYOiNdUp3i5jHzew_vTV86fu9";
function remoteDb(){
  function load(){return fetch(SB+"?select=*&order=created_at.desc&limit=200",{headers:{apikey:SBK}}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  return {
    doc:function(){return {set:function(d){
      var b={name:d.name,lv:d.lv,time:d.time,st:d.st,area:d.area,country:d.country,bio:d.bio};
      return fetch(SB,{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(r){ME=r[0].id;try{localStorage.setItem("drillpal-me",ME)}catch(e){}});
    }}},
    collection:function(){return {onSnapshot:function(f){load().then(function(rows){f({docs:rows.map(function(x){return {id:x.id,exists:true,data:function(){return x}}})})}).catch(function(){})}}}
  };
}
function initDb(){
  var local=typeof claude==="undefined"||!claude.use;
  (local?Promise.resolve().then(function(){try{ME=localStorage.getItem("drillpal-me")||"pending"}catch(e){ME="pending"}CAN=true;NOEDIT=true}):claude.use("user").then(function(u){
    if(!u)return;
    return Promise.all([u.id(),u.can("data.write")]).then(function(r){ME=r[0];CAN=r[1]});
  })).catch(function(){}).then(function(){return local?remoteDb():claude.use("db")}).then(function(db){
    DB=db;
    if(db){db.collection("players").onSnapshot(function(snap){
      M=snap.docs.filter(function(d){return d.exists}).map(function(d){var x=d.data();return mem({id:d.id,name:String(x.name||""),lv:x.lv,time:x.time,st:x.st,area:String(x.area||""),country:CC.indexOf(String(x.country))>-1?String(x.country):"",bio:String(x.bio||"")})}).filter(function(x){return x.n&&L[x.lv]&&TIMES.indexOf(x.time)>-1&&STY.indexOf(x.st)>-1});
      renderList();if(S.tab==="profile"&&!S.editing)renderProfile();
    },function(){})}
    renderProfile();
  }).catch(function(){renderProfile()});
}
function buildTime(){var o=["Any time","Weekday mornings","Weekday afternoons","Weekday evenings","Weekend mornings","Weekend afternoons","Weekend evenings"];$("#time").innerHTML=o.map(function(x){return '<option value="'+x+'"'+(S.time===x?" selected":"")+'>'+T(x)+'</option>'}).join("")}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=T(el.dataset.i18n)});
  $("#lvl").setAttribute("aria-label",T("Skill level"));$("#where").placeholder=T("Any suburb");$("#lang").setAttribute("aria-label",T("Language"));$("#lang").value=lang;
  buildTime();renderChips();renderList();renderReq();if(S.tab==="chat")renderChat();if(S.tab==="profile")renderProfile();
}
$("#lang").addEventListener("change",function(e){lang=e.target.value;try{localStorage.setItem("dp-lang",lang)}catch(x){}applyLang()});
applyLang();
initDb();
